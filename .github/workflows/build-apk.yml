
name: RadniSati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Postavi Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dozvoli pokretanje Gradle skripte
        run: chmod +x gradlew

      - name: Izgradi APK
        run: ./gradlew assembleDebug

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: RadniSati-APK
          path: app/build/outputs/apk/debug/*.apk
